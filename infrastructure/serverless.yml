# Operational parameters are defined in the shared monitoring_config.json below.
# Private recipient and runtime identity come only from the deployment environment.
service: ${file(../vacation_planner/src/vacation_planner/monitoring_config.json):service_name}
frameworkVersion: '4'
custom:
  settings: ${file(../vacation_planner/src/vacation_planner/monitoring_config.json)}
provider:
  name: aws
  region: ${self:custom.settings.region}
  stage: ${self:custom.settings.stage}
  stackName: ${self:service}-${self:provider.stage}
  deploymentBucket:
    name: ${env:DEPLOYMENT_BUCKET_NAME}
  stackParameters:
  - ParameterKey: NotificationEmail
    ParameterValue: ${env:ALERT_EMAIL}
  - ParameterKey: RuntimeIamUserName
    ParameterValue: ${env:RUNTIME_IAM_USER_NAME}
  stackTags:
    Project: vacation-planner
    Component: monitoring
    ManagedBy: github-actions
plugins:
- ./plugins/pipeline-only.cjs
resources:
  Parameters:
    NotificationEmail:
      Type: String
      NoEcho: true
      Description: Private administrator email for submission, result, and alarm messages.
      AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    RuntimeIamUserName:
      Type: String
      Description: Existing IAM user whose credentials the Streamlit app uses.
      AllowedPattern: '[\w+=,.@-]+'
  Resources:
    RequestLogs:
      Type: AWS::Logs::LogGroup
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        LogGroupName: ${self:custom.settings.log_group_name}
        RetentionInDays: ${self:custom.settings.log_retention_days}
    RequestLogStream:
      Type: AWS::Logs::LogStream
      Properties:
        LogGroupName:
          Ref: RequestLogs
        LogStreamName: ${self:custom.settings.log_stream_name}
    Notifications:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:custom.settings.topic_name}
        DisplayName: Vacation Planner updates
    AdministratorSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn:
          Ref: Notifications
        Protocol: email
        Endpoint:
          Ref: NotificationEmail
    AlarmPublishPolicy:
      Type: AWS::SNS::TopicPolicy
      Properties:
        Topics:
        - Ref: Notifications
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource:
              Ref: Notifications
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  Fn::Join:
                  - ''
                  - - 'arn:'
                    - Ref: AWS::Partition
                    - ':cloudwatch:'
                    - Ref: AWS::Region
                    - ':'
                    - Ref: AWS::AccountId
                    - ':alarm:'
                    - ${self:custom.settings.alarm_name_prefix}
                    - -*
    RuntimeMonitoringPolicy:
      Type: AWS::IAM::ManagedPolicy
      Properties:
        ManagedPolicyName: ${self:service}-${self:provider.stage}-runtime-monitoring
        Description: Write only Vacation Planner request logs and notifications.
        Users:
        - Ref: RuntimeIamUserName
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: logs:PutLogEvents
            Resource:
              Fn::Join:
              - ''
              - - 'arn:'
                - Ref: AWS::Partition
                - ':logs:'
                - Ref: AWS::Region
                - ':'
                - Ref: AWS::AccountId
                - ':log-group:'
                - Ref: RequestLogs
                - ':log-stream:'
                - ${self:custom.settings.log_stream_name}
          - Effect: Allow
            Action: sns:Publish
            Resource:
              Ref: Notifications
    SubmittedMetric:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName:
          Ref: RequestLogs
        FilterPattern: '{ $.event = "submitted" }'
        MetricTransformations:
        - MetricNamespace: ${self:custom.settings.metric_namespace}
          MetricName: Submitted
          MetricValue: '1'
          DefaultValue: 0
    SucceededMetric:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName:
          Ref: RequestLogs
        FilterPattern: '{ $.event = "succeeded" }'
        MetricTransformations:
        - MetricNamespace: ${self:custom.settings.metric_namespace}
          MetricName: Succeeded
          MetricValue: '1'
          DefaultValue: 0
    FailedMetric:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName:
          Ref: RequestLogs
        FilterPattern: '{ $.event = "failed" }'
        MetricTransformations:
        - MetricNamespace: ${self:custom.settings.metric_namespace}
          MetricName: Failed
          MetricValue: '1'
          DefaultValue: 0
    DurationMetric:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName:
          Ref: RequestLogs
        FilterPattern: '{ ($.event = "succeeded") || ($.event = "failed") }'
        MetricTransformations:
        - MetricNamespace: ${self:custom.settings.metric_namespace}
          MetricName: GenerationDuration
          MetricValue: $.duration_seconds
          Unit: Seconds
    NotificationFailureMetric:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName:
          Ref: RequestLogs
        FilterPattern: '{ $.event = "notification_failed" }'
        MetricTransformations:
        - MetricNamespace: ${self:custom.settings.metric_namespace}
          MetricName: NotificationFailures
          MetricValue: '1'
          DefaultValue: 0
    RepeatedFailuresAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:custom.settings.alarm_name_prefix}-repeated-failures
        AlarmDescription: Repeated plan-generation failures; individual requests also send status emails.
        Namespace: ${self:custom.settings.metric_namespace}
        MetricName: Failed
        Statistic: Sum
        Period: ${self:custom.settings.alarm_period_seconds}
        EvaluationPeriods: 1
        Threshold: ${self:custom.settings.failure_count_threshold}
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
        - Ref: Notifications
        OKActions:
        - Ref: Notifications
    SlowPlanningAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:custom.settings.alarm_name_prefix}-slow-planning
        Namespace: ${self:custom.settings.metric_namespace}
        MetricName: GenerationDuration
        Statistic: Maximum
        Period: ${self:custom.settings.alarm_period_seconds}
        EvaluationPeriods: 1
        Threshold: ${self:custom.settings.slow_request_seconds}
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
        - Ref: Notifications
        OKActions:
        - Ref: Notifications
    NotificationFailureAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:custom.settings.alarm_name_prefix}-notification-failures
        Namespace: ${self:custom.settings.metric_namespace}
        MetricName: NotificationFailures
        Statistic: Sum
        Period: ${self:custom.settings.alarm_period_seconds}
        EvaluationPeriods: 1
        Threshold: ${self:custom.settings.notification_failure_threshold}
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
        - Ref: Notifications
    MonitoringDashboard:
      Type: AWS::CloudWatch::Dashboard
      Properties:
        DashboardName: ${self:custom.settings.dashboard_name}
        DashboardBody:
          Fn::Join:
          - ''
          - - '{"widgets":[{"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Request outcomes","region":"'
            - &id001
              Ref: AWS::Region
            - '","period":300,"stat":"Sum","metrics":[["'
            - ${self:custom.settings.metric_namespace}
            - '","Submitted"],["'
            - ${self:custom.settings.metric_namespace}
            - '","Succeeded"],["'
            - ${self:custom.settings.metric_namespace}
            - '","Failed"],["'
            - ${self:custom.settings.metric_namespace}
            - '","NotificationFailures"]]}},{"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Generation
              duration (seconds)","region":"'
            - *id001
            - '","period":300,"stat":"Maximum","metrics":[["'
            - ${self:custom.settings.metric_namespace}
            - '","GenerationDuration"]]}},{"type":"log","x":0,"y":6,"width":24,"height":8,"properties":{"title":"Recent
              destinations and outcomes","region":"'
            - *id001
            - '","view":"table","query":"SOURCE '''
            - Ref: RequestLogs
            - ''' | fields @timestamp, request_id, destination, event, duration_seconds, error_category | sort @timestamp
              desc | limit 50"}}]}'
  Outputs:
    LogGroupName:
      Value:
        Ref: RequestLogs
    NotificationTopicArn:
      Value:
        Ref: Notifications
    DashboardName:
      Value: ${self:custom.settings.dashboard_name}
    RuntimeMonitoringPolicyArn:
      Value:
        Ref: RuntimeMonitoringPolicy
